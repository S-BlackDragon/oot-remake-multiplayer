# Co-op switches. Host.bat, Join.bat and play.cmd read this file and set each line
# for the emulator. A line with '#' in front is off: add or remove the '#', then close
# the emulator and start it again. Only LICHII_COOP_..., LICHII_ORM_..., EDEN_NX2_..., auto_update
# and the host's server_..., public_address_lookup, upnp, invite, stun_servers, relay, relay_key
# and color lines are read.
# A file path may be relative to this kit folder. Every player should use the same switches.
# ORM switches take 1, true, yes or on for on and 0, false, no or off for off (any case); any other
# value keeps the switch's default and writes "coop: switch NAME=VALUE is not ..." in the log. The
# switches renamed LICHII_ORM_... in kit 0.11 still work under their old LICHII_COOP_... name.

# --- Updates ---

# When Host.bat, Join.bat or play.cmd start and a newer co-op release is out, the kit
# updates itself (the emulator too, never with Fritchii's own updater) and starts the new
# version; your saves, keys, settings and this file are kept. ask: ask first (yes after 10 s
# with no key); yes: update without asking; no: only say that one is out (Update.bat).
auto_update = ask

# The update is checked against the SHA-256 published with the release. If the GitHub CLI
# (gh) is installed and logged in, the release's signature (attestation) is checked too, and
# an update that fails it is refused. To skip that signature check (not the SHA-256), take
# the '#' away:
# verify_signature = no

# --- Your colour ---

# Each player's Link wears a tunic in that player's colour in the other games, so you can
# tell each other apart (ten tunic colours; another colour gets the nearest). Remove the '#' and pick yours: red, orange, yellow, green, cyan, blue,
# purple, pink, white, black, brown, gray, or #RRGGBB (for example #FF8020). With the '#'
# in front, the one who hosts is blue and the others red, your own Link included (three or more
# players: pick colours, or the joiners all wear red).
# ORM: the launcher already writes a colour for each player into coop.ini (from the name, six
# different ones); a colour here wins over it. Players 5 and 6 with none get purple and orange.
# color = blue

# --- Who may join (the host only) ---

# The join password. Every session has one, and the traffic is encrypted with it. With no
# line here, or an empty one (the usual way), Host.bat makes a new random one each time it
# starts and puts it in the invite code, so nobody has to type it; the server window shows it
# for friends who join by address (Radmin, Hamachi, home network, port forward). Set your own
# here if you want the same one every time (no spaces; Join.bat then asks your friends for it
# unless they use the invite code). It never goes over the network (only a proof of it does).
# server_password =

# Only these players' addresses may join your server: their Hamachi (25.x.x.x) or Radmin
# (26.x.x.x) addresses, or their public addresses with port forwarding, comma-separated;
# a whole range as 26.0.0.0/8. Anyone else is turned away before they can send anything.
# server_allow = 25.1.2.3,25.4.5.6
# Listen only on this address of your PC (your own Hamachi or Radmin address), so the
# server cannot be reached through your home network or Wi-Fi at all.
# server_bind = 25.1.2.3
# ORM: the server also takes players over WebSocket (a ws:// address in Join.bat) on TCP, on the
# UDP port plus one (27511 with the usual port). Remove the '#' to close it: only UDP then.
# server_websocket = no
# When the server starts it asks api.ipify.org (over HTTPS) for your internet address, to
# show it to you for port forwarding. Remove the '#' to not ask.
# public_address_lookup = no

# --- Hosting without router setup (the host only; docs/play-online.md) ---

# Host.bat asks your router (UPnP) to forward the game's UDP port to this PC while the server
# runs, with a 10-minute lease it renews, and removes it when the server window closes. Many
# routers have UPnP off; then the invite code below still works for
# most friends. Remove the '#' to never ask the router:
# upnp = no
# Host.bat asks a free public STUN server (Google's, then Cloudflare's) for your internet
# address, from the game's own port, and shows an INVITE CODE (your internet address and the
# join password) that it copies to the clipboard. Your friends paste it into Join.bat. The
# STUN server sees your internet address, nothing of the game. Remove the '#' to turn it off:
# invite = no
# Other STUN servers to ask (name:port, comma-separated):
# stun_servers = stun.l.google.com:19302, stun.cloudflare.com:3478

# Advanced, off: host through a relay instead (no router or VPN setup): someone whose UDP port is open runs
# start-relay.cmd; put their address here. The server window then shows a join code
# (CODE@relay) for your friends to paste into Join.bat. The code only finds your server; the
# join password keeps strangers out, and the relay cannot read your game traffic (it is
# encrypted with the password).
# relay = relay.example.net:27530
# The relay's host key, if its owner gave you one:
# relay_key =
# --- Player against player (the host only) ---

# on: players can hurt each other with swords, items and shots, as enemies do. The host's
# value is the whole session's (a guest's line here does nothing), and the host can change it
# while playing by typing /pvp on or /pvp off in the chat. Nobody is hurt in a cutscene, a
# menu or while loading.
pvp = off

# --- On by default ---

# ORM: warp songs for the group (docs CANCIONES.md; seen in a game, viaje-cancion 2026-11-12: B played the Minuet
# in Kakariko, A held L and went with him to the Sacred Forest Meadow). When a mate leaves by a warp song, a notice
# says where, and holding L for the 10 s it stays open takes you there too. L is free while playing (comunicacion-aqui
# checks it in each game); LICHII_COOP_WARP_INVITE_BUTTON=R picks another button. 0 turns it off.
LICHII_COOP_WARP_INVITE=1

# ORM: the townsperson you talk to moves the same on the others' screens (charla-dos, 2026-11-12:
# the first talker keeps it, a second player's talk plays on his own copy, which blends back after):
# its head and face follow the talk instead of only its animation. Needs LICHII_COOP_NPC=1. 0 turns it off.
LICHII_COOP_NPC_POSE=1

# ORM: talk flags for everyone (two players' talks run in a game: charla-dos 2026-11-12, and
# charla-mido PASS with two players, sondas18r6, BANDERAS_CHARLA.md, D-R12). What a talk changes in
# the world is the same for all: Mido letting you pass, a Kokiri who moved, a deal, a quest step. The
# others see it once they cannot watch it jump (out of the scene, the townsperson far or gone).
# Greetings and "already talked" stay each player's own. The flags are listed in shared_talk.txt.
# Off: put a '#' in front of the line.
LICHII_COOP_TALK=shared_talk.txt

# ORM: the others' ocarina at their Link (ocarina-mano PASS 17/17 with two players, sondas18r6, 2026-11-12):
# each note another player plays sounds at his puppet, his songs are told (song ZeldaLullaby), and his
# own Ocarina is in his puppet's hands while he plays. 0 turns it off.
LICHII_COOP_OCARINA_SOUND=1

# ORM: water levels for the group (docs AGUA.md; seen in a game, meca-agua-templo, 2026-11-12): a water
# level is the same in every game, and a level another player set waits while your Link swims, falls
# or climbs in that water, at most LICHII_ORM_WATER_MAX_WAIT_S seconds (20; 0 waits for ever).
# LICHII_ORM_WATER_JABU=1 adds Jabu-Jabu's room 14 (not seen yet). Before kit 0.11 these were
# LICHII_COOP_WATER, _WATER_MAX_WAIT_S and _WATER_JABU. 0 turns it off.
LICHII_ORM_WATER=1
# LICHII_ORM_WATER_MAX_WAIT_S=20
# LICHII_ORM_WATER_JABU=1

# ORM: when a mate grows up or goes back to being a child at the Temple of Time, everyone else follows
# through the game's own era change and appears in the temple already changed, with a big notice and a
# 3 s countdown first; never in a cutscene, a boss fight or while down (docs EDAD.md, 2026-11-13).
# OFF until a game confirms it: the game refused the old event (ReplaceEquipmentForEraChange) 45 of 45
# times in the edad runs. 1 turns it on. LICHII_ORM_AGE_EVENT=<event> (tests only) reloads in place instead.
LICHII_ORM_AGE=0
# LICHII_ORM_AGE_EVENT=

# ORM: a second guard for heart containers (seen in a game, scenario corazon, 2026-11-12). A container
# anyone takes raises every Link's hearts (LICHII_COOP_HEARTS_TO_LINK, on); this also keeps the highest
# value seen, in case the game writes a lower one back. 0 turns it off.
LICHII_ORM_HEARTS=1

# The other players as Link (the real Link puppet, child or adult by your save's age),
# with their Navi. Needs the puppet pack (make-puppet-pack.cmd, once per PC); without
# the pack the others show only as markers.
LICHII_COOP_PUPPET=1

# Shared enemies and townspeople: life and kills follow the player who owns them.
# Pots, crates and rocks are shared the same way.
LICHII_COOP_OBJECTS=1

# Objects a player makes (Deku seeds, nuts, bombs, arrows) appear in the other games.
LICHII_COOP_SPAWN=1

# ORM: the townsperson you talk to becomes yours while you talk (and 1.5 s after), so the
# others see your talk on their copy instead of its old owner's pose overwriting it.
LICHII_COOP_NPC=1

# ORM: downed, not dead. With another player in the room, running out of hearts leaves you
# lying on the ground instead of the game over; a mate standing beside you holding A for 3 s
# revives you where you fell. Alone in the room the game over is the original. When everyone
# is down at once, the game over runs for all (group defeat).
LICHII_COOP_DOWNED=1

# ORM: spectator camera (needs LICHII_COOP_DOWNED=1). While you are down your camera turns
# smoothly to the nearest mate still standing and follows them; the d-pad right or left picks
# the next or the previous one; when you are up again the camera is yours. To wake the game's
# camera after a load, if you have not touched the right stick for 3 s the kit gives it one
# short right-left nudge while you stand (the view turns about 5 degrees, once per load).
# If that nudge bothers you, put a '#' in front: the rest of the co-op is the same.
LICHII_COOP_SPECTATOR=1

# ORM: story cutscenes for everyone (on since kit 0.8; LICHII_ORM_STORY_EVENTS=0 turns it off;
# before kit 0.11 it was LICHII_COOP_STORY=1, which still works). A story cutscene that starts in
# one game (meeting the Great Deku Tree, Saria on the bridge...) plays in every game in the same
# scene at the same moment, and a game that has seen it does not play it again. After a blue warp
# the cutscene is only for who took it; the others get its result. The cutscenes are listed in
# shared_story.txt (without LICHII_ORM_STORY_LIST, the same list built in). The story flags
# themselves (scenes seen, the forest exit wall, the owl) are shared by the co-op on its own
# (LICHII_COOP_STORY, on unless set to 0).
LICHII_ORM_STORY_EVENTS=1
# LICHII_ORM_STORY_LIST=shared_story.txt

# ORM: the Temple of Time (new, 2026-11-11; not tried in a game yet; with the story cutscenes on).
# The temple is a part of the market's scene: its cutscenes (the Door of Time, the pedestal, Sheik)
# play only for the players inside the temple, and whoever is inside when the Master Sword is drawn
# travels with it; the others turn adult (or child) where they stand once nothing runs in their
# game (with the room's age on: LICHII_ORM_AGE=1). The rules are in shared_time_temple.txt (without
# the line below, the same list built in). To turn them off: LICHII_ORM_TIME=0
# LICHII_ORM_TIME_LIST=shared_time_temple.txt

# ORM: Gerudo Fortress and the Spirit Temple (new, 2026-11-11; not tried in a game yet): each game
# has its own guards and desert guide; a carpenter count lost when two free them at once mends itself;
# a Spirit Temple cutscene plays only for the players of the age of who started it. To turn the count
# and the cutscene rule off: LICHII_ORM_GERUDO=0

# ORM: the child blocks' world for everyone (new in kit 0.10): Mido and the Kokiri blockers, the
# Meadow's gate, the bombable rocks, walls and grotto covers of the child overworld, Goron City's
# torches and Darunia's door, Zora's River's waterfall, and the sensors of one player taken off the
# dungeons' list; and the adult part (shared_dungeon_adult.txt): the adult overworld (Gerudo
# carpenters, desert gate, Skulltula House rewards, Door of Time), the adult dungeons' sensors of
# one player and their step switches taken off; and the minigames (shared_dungeon_minigames.txt): each
# player plays them in his own game, a prize given once (heart piece, bag, quiver, scale, bottle) is
# given once for the group, Biggoron's trade step goes with the trade item; the songs
# (shared_dungeon_songs.txt: the frogs, the Song of Time blocks that go for good, Pierre,
# docs/CANCIONES.md); the temples (shared_dungeon_temples.txt): a Goron of the Fire Temple
# freed by one player is gone from his cell for everyone; Death Mountain, Goron City, the Ice
# Cavern and the Shadow Temple (shared_dungeon_montana.txt: adult rocks, the big pot, the rolling
# Gorons and Link the Goron stopped once); the towns (shared_dungeon_towns.txt: Kakariko's
# ReDead grotto, the Graveyard's Poes and royal tomb, Ruto's letter, the lake's water held while
# we are in Hyrule Field, King Zora's ice held while we are in the Domain, the castle gate); the
# collectibles (shared_dungeon_collectibles.txt, new, not tried in a game yet): a loose heart piece
# one player takes is gone for all, a bean one child plants is planted for all (the adult's
# platform is there in every game), the Lost Woods scrub's two upgrades are sold once; and the
# bottles and trade chains (shared_dungeon_trades.txt): a bottle handed out once (the Market
# shop's, Ruto's letter, the Poe collector's) is handed out once for the group, what is in a bottle
# stays each player's, the Mask Shop and Biggoron chains are one for the group, and the Odd
# Mushroom, the Eyeball Frog and the Eye Drops stay with who got them (their timer runs only in his
# game). Comment the line out to turn it off. For more lists, put this folder: "." (every
# shared_dungeon_*.txt here).
LICHII_COOP_DUNGEON_LISTS=shared_dungeon_child.txt,shared_dungeon_adult.txt,shared_dungeon_minigames.txt,shared_dungeon_songs.txt,shared_dungeon_temples.txt,shared_dungeon_montana.txt,shared_dungeon_towns.txt,shared_dungeon_collectibles.txt,shared_dungeon_trades.txt

# ORM: ZMP's inventory rules (new, 2026-11-11; not tried in a game yet): the magic meter filled for
# everyone when it grows. Rupees are each player's own (2026-11-11), and with the HUD on
# (LICHII_COOP_HUD=1) a line of the picture (LICHII_ORM_HUD_RUPEES below) and the panel (F9) list
# every connected player's rupees. There is no bank in this game (docs HUD_AJUSTES.md). Ammo, bottle contents,
# worn gear, item buttons, life and magic now stay each player's own too; items, upgrades (the
# wallets too), bags and bottles are shared. The rules are in shared_items.txt. Every player needs
# the same line. Comment it out for upstream's rules (the meter is not filled).
LICHII_ORM_ITEM_RULES=shared_items.txt

# ORM: the end of the game with six (new, 2026-11-11; not tried in a game yet). Ganon's Castle's
# barriers: two trials finished at the same moment in two games are both counted, so the tower's
# barrier falls at six (the counted Ints are in shared_counts.txt). Every player needs the same line.
LICHII_ORM_COUNTS=shared_counts.txt
# Twinrova: while Kotake's ice holds your Link, the sisters stay with your game so the ice thaws
# (on without a switch). To turn it off:
# LICHII_ORM_TWINROVA_KEEP=0

# ORM: the name tags, the ping, the panel (F9), the chat and the notices drawn inside the game's
# own picture (docs HUD_EN_JUEGO.md; on since kit 0.11). Off: the tags drawn over the window.
LICHII_COOP_HUD=1
# ORM: your mates on the minimap and the pause map, arrows at the screen's edge and "Ana: en
# <place>" (docs MAPA_COMPANEROS.md; needs the HUD above). 0 turns it off.
LICHII_COOP_MAP=1
# ORM: your own HUD (docs HUD_AJUSTES.md; needs the HUD above; new, 2026-11-12, not tried in a
# game yet). These are yours alone: each player may set them as he likes. While playing, the chat
# changes them until the game closes: /rupias on|off, /nombres on|off, /hud (the settings now),
# /hud panel <place>, /hud tamano <50-300>, /hud chat <0-6>, /hud reset.
# Everyone's rupees on one line of the picture (0: only in the panel, F9), and where:
LICHII_ORM_HUD_RUPEES=1
LICHII_ORM_HUD_RUPEES_AT=arriba
# Where the panel (F9) goes. A place is arriba-izquierda, arriba, arriba-derecha,
# abajo-izquierda, abajo or abajo-derecha.
LICHII_ORM_HUD_PANEL_AT=arriba-izquierda
# The names over the others (0: only their arrows and dots); the text size in percent (50 to
# 300); how many chat lines show (0 to 6).
LICHII_ORM_HUD_NAMES=1
LICHII_ORM_HUD_SIZE=100
LICHII_ORM_HUD_CHAT_LINES=6
# ORM: quick chat (new in kit 0.11): hold L and press the d-pad: up "Aqui!", right "Vamos!", down
# "Espera!", left "Ayuda!"; the d-pad is kept from the game while L is held. Another button:
# LICHII_ORM_QUICK_CHAT_BUTTON=R (R, ZL, ZR, PLUS, MINUS, LCLICK, RCLICK). 0 turns it off.
LICHII_ORM_QUICK_CHAT=1
# ORM: the others' Links move smoothly (positions eased between samples); 0: as before.
LICHII_ORM_SMOOTH=1
# ORM: the others are seen getting on, riding and getting off a horse (Epona's look once
# make-puppet-pack has been run with this kit; an older puppet pack gives a plain horse). 0: a
# player on horseback vanishes while he rides (his name stays).
LICHII_ORM_HORSE=1

# Items, songs, one-time pickups, small keys, Skulltula tokens, heart pieces and the
# dungeons' switches, doors, cleared rooms and water levels are shared without a switch.
# To turn them off:
# LICHII_COOP_ITEMS=0
# LICHII_COOP_DUNGEON=0
# Time of day follows the host (on without a switch). To turn it off:
# LICHII_COOP_TIME=0
# No Navi on the other players:
# LICHII_COOP_FAIRY=0
# The other players' tunic colours; 0 shows everyone in green:
# LICHII_COOP_TUNICS=0
# ORM: Epona herself is the group's: one player wins her at Lon Lon and everyone calls his own; the
# race waits for the group. To have each game win its own (LICHII_COOP_EPONA before kit 0.11):
# LICHII_ORM_EPONA=0
# ORM: one shared clock owned by the host, the others' clocks nudged smoothly to it (docs HORA.md).
# Off: daurosk's own time rules. Without nudges: time changes as daurosk's, with the shared clock:
# LICHII_ORM_CLOCK=0
# LICHII_ORM_CLOCK_NUDGE=0
# ORM: after a group game over (everyone down), the group goes on with what it had when it fell
# (keep, the default; needs LICHII_COOP_DOWNED=1). save: follow the host's Continue instead; 0: off.
# LICHII_ORM_CONTINUE=save
# ORM: the escape from Ganon's collapsing castle goes with the group: a game still in the escape
# follows a mate who reached the last fight. Off: each one finds his own way out:
# LICHII_ORM_GROUP_EXIT=0
# ORM: a mate who plays the ocarina has it in his left hand (sub, the default); bow: in the right
# hand; 0: not drawn in his hand:
# LICHII_ORM_OCARINA_HAND=bow
# ORM: with LICHII_COOP_DOWNED=1, the boss room takes a downed Link in with the group, and a game
# over in the boss room brings you back into it. Each one on its own (on with LICHII_COOP_DOWNED=1):
# LICHII_COOP_BOSS_PULL_DOWNED=0
# LICHII_COOP_BOSS_RESPAWN=0
# ORM: a player on a lift, a moving or floating floor or the Shadow Temple's boat is seen standing on
# your copy of it, moving with it, instead of floating above it or sinking through it (new,
# 2026-11-11; not tried in a game yet; needs LICHII_COOP_OBJECTS=1). Each game still runs its own
# lifts and boat. To turn it off (every player the same):
# LICHII_ORM_RIDE=0

# --- Off by default ---

# The information panel in the top left (players, ping, scene); off by default.
# LICHII_COOP_PANEL=1   shows the co-op information panel (F9 toggles it)

# ORM: held floor switches (docs SOSTENIDOS.md): one player stands on a switch, another walks through
# the door it holds. Unset (flag, the default): a switch another player stands on is pressed in your
# game with its "Link on it" flag (seen in a game: the Fire Temple's fire wall opens, 2026-11-12);
# log: only watched and logged; 1 (or press): the flag and the actor words of a list file; 0: off.
# Before kit 0.11: LICHII_COOP_HELD_SWITCHES and LICHII_COOP_HELD_SWITCH_LIST.
# LICHII_ORM_HELD_SWITCHES=1
# LICHII_ORM_HELD_SWITCH_LIST=held_switches.txt

# ORM: talk flag rules without the talk list (flags another list shares wait while their
# townsperson is in view; on by itself with LICHII_COOP_TALK), and a file of more rules:
# LICHII_COOP_FLAGS_DEFER=1
# LICHII_COOP_FLAGS_DEFER_LIST=talk_rules.txt

# ORM: how the spectator camera wakes the game's camera after a load: stick (the default, the short
# nudge), bits, both or none:
# LICHII_COOP_SPECTATOR_WAKE=none

# ORM: the horse the others ride (a puppet pack actor; by default Epona's look, a plain horse with
# an older pack) and where the rider sits on it (x,y,z; 0,1.2,0 by default):
