# LICHII_COOP_DEBUG_OBJECTS=1
# A status line per puppet each second:
# LICHII_COOP_DEBUG_PUPPET=1
# One test puppet beside you (a second Link and fairy that stand still):
# LICHII_COOP_TEST_PUPPET=1
# ORM: the game camera's probe (where the spectator camera reads it) and its yaw rule
# (sign,offset; 1,180 by default):
# LICHII_COOP_DEBUG_CAMERA2=1
# LICHII_COOP_CAMERA_YAW_RULE=1,180
# ORM: your Link's life and status as the co-op reads them:
# LICHII_COOP_DEBUG_LIFE=1
# ORM: where your Link sits on your own Epona (the value for LICHII_ORM_HORSE_SADDLE):
# LICHII_ORM_DEBUG_HORSE=1
# ORM: the words of a held switch your Link steps on or off, as list lines:
