# after the start (N@D):
# LICHII_ORM_CLOCK_TEST_OFF=600@5
# LICHII_ORM_CLOCK_TEST_JUMP=21600@5

# ORM: real bodies between Links (docs CHOQUE.md): your Link stops at a mate's body and can stand on
# his head; on one Continue spot nobody is pushed or wedged (the mate's puppet is drawn 1 m aside and
# his body waits until you are clear). Seen in a game on test10 (2026-11-13). 0 turns it off on this
# PC (the mates are only drawn aside); the room's /choque off turns the bodies off for everyone.
LICHII_ORM_BODIES=1

# --- Emulator ---

# Shader libraries (graphics pipeline libraries). With an AMD card and no NVIDIA one the kit
# turns them off by itself, since AMD's driver crashes with them (amdvlk64.dll). A line here
# wins over that: 0 off (try it if the game crashes in amdvlk64.dll), 1 on.
# EDEN_NX2_GPL=0
